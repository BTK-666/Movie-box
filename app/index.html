<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The stream CDN (bcdn.hakunaymatata.com) answers 429 to any request that
         carries a Referer. A Capacitor WebView serves the app from
         https://localhost, so media requests would otherwise send
         `Referer: https://localhost/` and every stream would fail to load. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0b0b0f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c5cff'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>MovieBox+</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
