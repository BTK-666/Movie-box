<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The stream CDN (bcdn.hakunaymatata.com) answers 429 to any request that
         carries a Referer. A Capacitor WebView serves the app from
         https://localhost, so media requests would otherwise send
         `Referer: https://localhost/` and every stream would fail to load. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>MovieBox+</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
